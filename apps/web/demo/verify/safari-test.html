<!doctype html>
<html lang="ja" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>theme-toggle デモ — Liquid Glass</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Noto+Sans+JP:wght@400;600;700&display=swap" />
  <link rel="stylesheet" href="./safari-test.css" />
  <style>
    :root {
      --page-bg: linear-gradient(168deg, #f3f5fa, #edf0f6 46%, #f5f7fa);
      --page-fg: #101521;
      --page-sub: #59616f;
    }
    html[data-theme='dark'] {
      --page-bg: linear-gradient(168deg, #101318, #0c0f14 50%, #111419);
      --page-fg: #f2f5fb;
      --page-sub: rgba(233, 237, 243, 0.6);
    }
    html[data-theme='clear'] {
      --page-bg:
        radial-gradient(720px 520px at 18% 12%, rgba(30, 80, 255, 0.2), transparent 62%),
        radial-gradient(640px 480px at 84% 30%, rgba(255, 130, 200, 0.2), transparent 60%),
        radial-gradient(620px 520px at 60% 92%, rgba(0, 200, 190, 0.16), transparent 62%),
        linear-gradient(168deg, #f3f5fa, #eef0f6 46%, #f5f7fa);
      --page-fg: #101521;
      --page-sub: #59616f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Manrope, 'Noto Sans JP', system-ui, sans-serif;
      background: var(--page-bg);
      color: var(--page-fg);
      /* テーマのクロスフェード（約0.5s） */
      transition: background-color 500ms ease, color 500ms ease;
      display: grid;
      place-items: center;
    }
    main { text-align: center; padding: 40px 24px; }
    h1 { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; margin: 0 0 6px; }
    p.sub { font-size: 13px; color: var(--page-sub); margin: 0 0 44px; transition: color 500ms ease; }
    /* レンズがバーからはみ出すぶんの余白 */
    .toggle-slot { padding: 24px 0; }
    p.under {
      max-width: 420px;
      margin: 40px auto 0;
      font-size: 13.5px;
      line-height: 2;
      color: var(--page-sub);
      transition: color 500ms ease;
    }
    output {
      display: inline-block;
      margin-top: 18px;
      font-size: 12px;
      font-weight: 700;
      color: var(--page-sub);
      font-variant-numeric: tabular-nums;
    }
    /* 段階検証用: ?stage=bar でレンズを隠してバーだけ見る */
    html.stage-bar .tt-lens { display: none; }
  </style>
</head>
<body>
  <main>
    <h1>Liquid Glass テーマ切替</h1>
    <p class="sub">クリックか、Tab → ← → → Enter で切り替え。アイドル時は完全に静止します。</p>
    <div class="toggle-slot">
      <theme-toggle></theme-toggle>
    </div>
    <p class="under">
      レンズが移動する中間で、このバーのラベル文字が屈折して歪みます。
      移動が終わるとレンズは完全に静止し、ページ全体の配色は約0.5秒でクロスフェードします。
    </p>
    <output id="state" aria-live="polite"></output>
  </main>

  <script type="module">
    import '../../src/components/theme-toggle/theme-toggle.js';
    const toggle = document.querySelector('theme-toggle');
    const out = document.getElementById('state');
    const show = () => (out.textContent = `data-theme="${document.documentElement.dataset.theme}"`);
    toggle.addEventListener('themechange', show);
    customElements.whenDefined('theme-toggle').then(show);
    if (new URLSearchParams(location.search).get('stage') === 'bar') {
      document.documentElement.classList.add('stage-bar');
    }
  </script>
</body>
</html>
