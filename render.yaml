# プラン方針（2026-07-26 決定）: 3 サービスとも starter = スリープ無しの常時稼働。
#   - free はアイドル ~15 分でスリープし、復帰に 30-50s かかる（gateway が寝ると全 API が無反応に見える）。
#   - starter でもインスタンスの RAM は増えない想定のため、n8n の NODE_OPTIONS ヒープ調整は据え置く。
#     さらに余裕が要る場合はプランを上げる（現行スペック/価格は Render の料金ページで要確認）。
#   - 常時稼働になるので .github/workflows/keepalive.yml の定期実行は停止済み（手動実行のみ残置）。
services:
  - type: web
    name: org-ai-api-gateway
    runtime: node
    buildCommand: |
      npm install --workspaces --include-workspace-root &&
      npx prisma generate --schema=packages/db-schema/prisma/schema.prisma &&
      npm run build --workspace=packages/shared-types &&
      npm run build --workspace=apps/api-gateway
    # Neon は scale-to-zero でアイドル時に compute が停止する。デプロイ直後の 1 発目が
    # 起動待ちに当たると P1001 (Can't reach database server) で即 exit し、デプロイ全体が
    # 失敗する（実際に 2026-07-26 のデプロイがこれで落ちた）。復帰を待てるよう指数バックオフで
    # リトライする。全滅した場合は exit 1 = 未マイグレーションのまま起動させない（Render は
    # 直前のデプロイを生かしたままにする）。
    startCommand: |
      attempt=1; max=5
      until npx prisma migrate deploy --schema=packages/db-schema/prisma/schema.prisma; do
        if [ "$attempt" -ge "$max" ]; then
          echo "migrate deploy failed after ${max} attempts - aborting"
          exit 1
        fi
        wait=$((attempt * 10))
        echo "migrate deploy failed (attempt ${attempt}/${max}) - DB may be waking; retrying in ${wait}s"
        sleep "$wait"
        attempt=$((attempt + 1))
      done
      exec node apps/api-gateway/dist/index.js
    plan: starter
    healthCheckPath: /health
    # ⚠️ SIGTERM から強制終了までの猶予。応答後も裏で走る処理（エージェント実行・
    #    RAG索引・領収書読み取り・返信下書き）を片付ける時間が要る。
    #    既定の 30 秒だと drain 予算 20 秒 + DB 切断で際どいので伸ばしてある。
    #    SHUTDOWN_DRAIN_MS を上げるときは、必ずこちらも上げること。
    maxShutdownDelaySeconds: 90
    envVars:
      - key: NODE_ENV
        value: production
      # 終了時に走行中の処理を待つ上限(ms)。maxShutdownDelaySeconds より短くすること
      - key: SHUTDOWN_DRAIN_MS
        value: "20000"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: AI_ENGINE_URL
        sync: false
      # ai-engine を呼ぶときの共有シークレット。ai-engine と **同じ値** を入れること。
      # 未設定なら送らず、ai-engine 側も素通しするので、片方だけのデプロイでは落ちない。
      - key: INTERNAL_API_TOKEN
        sync: false
      # ファイルの保存先。⚠️ 未設定だとローカルディスクに書き、次のデプロイで実体が消える。
      # バケット（既定 org-files）は非公開で作っておくこと。service_role キーはここにだけ置く。
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: org-files
      # RAG: 埋め込みプロバイダ。キーが無ければ RAG は no-op（チャットは従来通り）。
      # 既定は gemini＝LLM 用の GEMINI_API_KEY を流用できるので追加契約が不要。
      # gemini-embedding-001 は outputDimensionality=1024 に対応し DB の vector(1024) と一致する。
      - key: EMBEDDING_PROVIDER
        value: gemini
      - key: EMBEDDING_MODEL
        value: gemini-embedding-001
      # 埋め込み用キー。未設定なら下の GEMINI_API_KEY を流用する。
      - key: EMBEDDING_API_KEY
        sync: false
      # gateway 側でも埋め込み生成に Gemini を呼ぶため必要（ai-engine と同じキーで可）。
      - key: GEMINI_API_KEY
        sync: false
      - key: N8N_CLOUD_URL
        sync: false
      - key: N8N_API_KEY
        sync: false
      - key: N8N_WORKFLOW_ID
        sync: false
      - key: N8N_WEBHOOK_AUTH_TOKEN
        sync: false
      # LINE 受信箱: チャネル資格情報 (channel secret / access token) の暗号化鍵。
      # 32 バイトを 64 桁 hex または base64 で指定。未設定時は JWT_SECRET から導出
      # （JWT_SECRET をローテすると既存の接続が復号不能になるため独立設定を推奨）。
      - key: CHANNEL_CREDENTIAL_ENC_KEY
        sync: false
      # セルフサーブ Google 連携 (設定 > 連携)。GCP の OAuth クライアント (ウェブアプリ)。
      # リダイレクト URI: https://org-ai-api-gateway.onrender.com/api/oauth/google/callback
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      # OAuth コールバック URL と LINE webhook URL 表示の組み立てに使う自分自身の公開 URL。
      # 例: https://org-ai-api-gateway.onrender.com
      - key: API_GATEWAY_URL
        sync: false

  - type: web
    name: org-ai-ai-engine
    runtime: python
    rootDir: apps/ai-engine
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: API_GATEWAY_URL
        sync: false
      # 松竹梅ルーティング: 梅/竹=Gemini(無料枠), 松/admin=Claude
      - key: GEMINI_API_KEY
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      # ⚠️ ai-engine は公開 URL を持つ。未設定だと誰でも /llm/chat・/vision/receipt を叩けて
      #    Anthropic の課金がこちら持ちで発生し、任意の org_id で AILog を汚せる。
      #    api-gateway と **同じ値** を入れること（片方だけでは 401 になる）。
      - key: INTERNAL_API_TOKEN
        sync: false

  - type: web
    # ⚠️ 実際に稼働しているサービス名は org-ai-n8n-web。ここが `org-ai-n8n` のままだと
    #    宣言と実態が食い違う（2026-08-24 の実機確認: org-ai-n8n は
    #    x-render-routing: suspend-by-user で停止中、org-ai-n8n-web が 200 を返し
    #    Supabase の n8n スキーマに結線されている）。
    # ⚠️ Blueprint 同期でサービス名を変更すると、Render は旧サービスを削除して新規作成する
    #    ことがある。この行を変えたまま同期する前に、必ずダッシュボードで
    #    org-ai-n8n-web が Blueprint 管理下にあるかを確認すること。
    name: org-ai-n8n-web
    runtime: image
    image:
      # ⚠️ :latest は不意のメジャー更新→大量DBマイグレーション+OOM を誘発した実績あり（2026-07-08）。
      # 稼働バージョンを確認して n8nio/n8n:<version> に固定することを推奨（n8n UI 左下 or deploy ログ）。
      url: docker.io/n8nio/n8n:latest
    plan: starter
    envVars:
      # Node 既定ヒープ(~256MB)だと migration/高負荷時に OOM → 上限を拡張。
      # starter でも RAM は増えない想定のため、この調整は引き続き必要。
      - key: NODE_OPTIONS
        value: "--max-old-space-size=400"
      - key: N8N_PORT
        value: "5678"
      - key: N8N_PROTOCOL
        value: "https"
      - key: N8N_HOST
        sync: false
      - key: WEBHOOK_URL
        sync: false
      - key: N8N_EDITOR_BASE_URL
        sync: false
      - key: GENERIC_TIMEZONE
        value: "Asia/Tokyo"
      - key: DB_TYPE
        value: "postgresdb"
      - key: DB_POSTGRESDB_HOST
        sync: false
      - key: DB_POSTGRESDB_PORT
        value: "5432"
      - key: DB_POSTGRESDB_DATABASE
        sync: false
      # n8n は起動時に約40テーブルを自分で作る。専用スキーマに隔離してアプリの public と
      # 混ぜない（n8n だけ作り直したいときは DROP SCHEMA n8n CASCADE で済む）。
      # 既存の Neon から移行する場合、n8n は新スキーマに作り直しになる。
      - key: DB_POSTGRESDB_SCHEMA
        value: n8n
      - key: DB_POSTGRESDB_USER
        sync: false
      - key: DB_POSTGRESDB_PASSWORD
        sync: false
      - key: DB_POSTGRESDB_SSL_REJECT_UNAUTHORIZED
        value: "false"
      - key: N8N_ENCRYPTION_KEY
        sync: false
      - key: EXECUTIONS_DATA_PRUNE
        value: "true"
      - key: EXECUTIONS_DATA_MAX_AGE
        value: "168"
      - key: N8N_DIAGNOSTICS_ENABLED
        value: "false"
