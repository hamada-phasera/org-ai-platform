# PR と main への push で、TypeScript / Python / Go の lint・型チェック・テスト・ビルドを回す。
#
# ⚠️ DB・外部 API・シークレットには一切触れない。
#   - gateway のテストは prisma をモックしているので DB 不要（prisma generate だけ要る）
#   - ai-engine のテストは LLM をスタブしているので API キー不要
#   - どちらも環境変数を何も設定しない状態（env -i）で通ることをローカルで確認済み
# ローカルで同じことをするなら: README.md「テスト・lint・型チェック」を参照。

name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  node:
    name: TypeScript (web / api-gateway / packages)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # undici 8（api-gateway の依存）は Node >=22.19 を要求する。20 だと http-node/client.ts を読むテストが落ちる。
          # Dockerfile・.node-version・render.yaml も 22（scripts/check-deploy-config.mjs が突き合わせる）
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Prisma generate
        run: npm run prisma:generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build (shared-types → api-gateway, web)
        run: npm run build

  python:
    name: Python (ai-engine)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/ai-engine
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11' # 本番 Dockerfile と同じ
          cache: pip
          cache-dependency-path: |
            apps/ai-engine/requirements.txt
            apps/ai-engine/requirements-dev.txt

      - name: Install
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff
        run: ruff check .

      - name: Pytest
        run: python -m pytest -q

  go:
    name: Go (usage-metrics-svc)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: usage-metrics-svc
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: usage-metrics-svc/go.mod
          cache-dependency-path: usage-metrics-svc/go.sum

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  # docker compose が .env も鍵も無しで一発で起動し、登録まで通ることを確かめる（計画書チャンク 8）。
  # ⚠️ ここだけ Docker を使う。外部 API・シークレットは使わない（LLM の鍵が無くても登録は通る）。
  compose-smoke:
    name: docker compose（.env 無しで起動 → 登録）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: .env が無いこと
        run: test ! -e .env

      - name: 設定が .env 無しで解決できる
        run: docker compose config --quiet

      - name: 起動（healthcheck が通るまで待つ）
        run: docker compose up --build --detach --wait --wait-timeout 900

      - name: /health と /ready
        run: |
          curl -fsS http://127.0.0.1:4000/health
          curl -fsS http://127.0.0.1:4000/ready
          curl -fsS http://127.0.0.1:3000/ -o /dev/null

      - name: 登録 1 回（web の nginx 経由）
        run: |
          code=$(curl -sS -o register.json -w '%{http_code}' -X POST http://127.0.0.1:3000/api/auth/register \
            -H 'content-type: application/json' \
            -d '{"name":"Smoke","email":"smoke@example.com","password":"smoke-pass-1234","orgName":"Smoke Co"}')
          echo "status=$code"
          test "$code" = "201"
          node -e 'const b=require("./register.json"); if(!b.success||!b.data.token||!b.data.user.orgId) process.exit(1)'

      - name: 失敗したらログ
        if: failure()
        run: docker compose logs --no-color --tail=300

      - name: 片付け
        if: always()
        run: docker compose down -v
