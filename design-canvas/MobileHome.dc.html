<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; font-family: 'Manrope','Noto Sans JP',system-ui,sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #3D4EFF; text-decoration: none; }
    a:hover { color: #2A38D6; }
    .mono { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; }
    .tab { flex: 1; border: none; background: transparent; font-family: inherit; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; height: 56px; color: #6A7280; }
    .tab-on { color: #101521; }
    .liquid {
      background: rgba(255,255,255,0.72);
      backdrop-filter: blur(14px) saturate(1.5);
      -webkit-backdrop-filter: blur(14px) saturate(1.5);
      border: 1px solid rgba(255,255,255,0.9);
      box-shadow: 0 1px 2px rgba(16,21,33,0.04), 0 8px 24px rgba(16,21,33,0.05);
    }
    @supports not (backdrop-filter: blur(1px)) {
      .liquid { background: #FFFFFF; border-color: #E7E9ED; }
    }
    .navbar { background: rgba(255,255,255,0.78); backdrop-filter: blur(16px) saturate(1.6); -webkit-backdrop-filter: blur(16px) saturate(1.6); border-top: 1px solid rgba(231,233,237,0.9); }
    @supports not (backdrop-filter: blur(1px)) { .navbar { background: #FFFFFF; border-top-color: #E7E9ED; } }
  </style>
</helmet>

<div style="width:390px;height:844px;background:#FBFBFC;color:#101521;display:flex;flex-direction:column;overflow:hidden;box-sizing:border-box;position:relative;">

  <div style="position:absolute;inset:0;pointer-events:none;">
    <div style="position:absolute;top:-60px;left:-40px;width:340px;height:320px;border-radius:50%;background:radial-gradient(circle at 50% 50%, rgba(61,78,255,0.12), rgba(61,78,255,0) 68%);"></div>
    <div style="position:absolute;top:300px;right:-90px;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle at 50% 50%, rgba(13,148,136,0.10), rgba(13,148,136,0) 68%);"></div>
  </div>

  <header style="height:56px;flex-shrink:0;display:flex;align-items:center;gap:9px;padding:0 12px;box-sizing:border-box;position:relative;z-index:1;">
    <div style="width:26px;height:26px;border-radius:7px;background:#101521;display:flex;align-items:center;justify-content:center;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h11M4 18h7"/></svg></div>
    <div style="font-size:14px;font-weight:800;letter-spacing:-0.01em;">FLOW</div>
    <button aria-label="検索" style="margin-left:auto;width:44px;height:44px;border-radius:12px;border:1px solid #E7E9ED;background:rgba(255,255,255,0.7);display:flex;align-items:center;justify-content:center;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#59616F" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></button>
    <button aria-label="アカウント" style="width:44px;height:44px;border-radius:12px;border:none;background:transparent;display:flex;align-items:center;justify-content:center;">
      <span style="width:32px;height:32px;border-radius:50%;background:#F5F6F8;border:1px solid #E7E9ED;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;color:#59616F;">濱</span>
    </button>
  </header>

  <div style="flex:1;overflow:hidden;padding:14px 14px 0;box-sizing:border-box;position:relative;z-index:1;">

    <div style="font-size:22px;font-weight:800;letter-spacing:-0.02em;line-height:1.4;">おはようございます、<br>濱田さん。</div>
    <div style="font-size:12.5px;color:#59616F;margin-top:8px;line-height:1.7;">今日やることを一行で伝えてください。担当の部署AIに振り分けます。</div>

    <div class="liquid" style="display:flex;align-items:center;gap:10px;height:52px;border-radius:13px;padding:0 6px 0 14px;margin-top:16px;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#6A7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M21 11.5a8.4 8.4 0 01-9 8.4 8.9 8.9 0 01-4-.9L3 21l1.9-4.9A8.4 8.4 0 013.6 11 8.4 8.4 0 0112 3a8.4 8.4 0 019 8.5z"/></svg>
      <label for="mtop-input" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;">今日は何をしますか？</label>
      <input id="mtop-input" readonly value="" placeholder="今日は何をしますか？" style="flex:1;border:none;outline:none;background:transparent;font-family:inherit;font-size:14px;color:#101521;min-width:0;">
      <button aria-label="送信" style="width:44px;height:44px;border-radius:12px;border:none;background:#101521;display:flex;align-items:center;justify-content:center;flex-shrink:0;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px;">

      <button class="liquid" style="border-radius:15px;padding:16px 14px;text-align:left;font-family:inherit;color:inherit;display:flex;flex-direction:column;min-height:132px;box-sizing:border-box;">
        <span style="width:38px;height:38px;border-radius:11px;background:rgba(79,70,229,0.10);display:flex;align-items:center;justify-content:center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4F46E5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V8z"/><path d="M14 3v5h5"/></svg></span>
        <span style="font-size:14px;font-weight:800;margin-top:11px;line-height:1.45;">提案書を<br>つくる</span>
        <span style="font-size:10.5px;color:#6A7280;font-weight:600;margin-top:auto;">セールスくん</span>
      </button>

      <button class="liquid" style="border-radius:15px;padding:16px 14px;text-align:left;font-family:inherit;color:inherit;display:flex;flex-direction:column;min-height:132px;box-sizing:border-box;">
        <span style="width:38px;height:38px;border-radius:11px;background:rgba(13,148,136,0.10);display:flex;align-items:center;justify-content:center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0D9488" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V10M10 19V5M16 19v-6M21 19H3"/></svg></span>
        <span style="font-size:14px;font-weight:800;margin-top:11px;line-height:1.45;">数字を<br>見る</span>
        <span style="font-size:10.5px;color:#6A7280;font-weight:600;margin-top:auto;">アナリーゼ</span>
      </button>

      <button class="liquid" style="border-radius:15px;padding:16px 14px;text-align:left;font-family:inherit;color:inherit;display:flex;flex-direction:column;min-height:132px;box-sizing:border-box;border-color:rgba(253,230,138,0.9);">
        <span style="display:flex;align-items:center;gap:8px;">
          <span style="width:38px;height:38px;border-radius:11px;background:rgba(217,119,6,0.12);display:flex;align-items:center;justify-content:center;flex-shrink:0;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#B45309" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 12l2 2 4-4"/><circle cx="12" cy="12" r="9"/></svg></span>
          <span style="display:inline-flex;align-items:center;height:21px;padding:0 8px;border-radius:6px;background:#FFFBEB;border:1px solid #FDE68A;font-size:10.5px;font-weight:800;color:#B45309;">1件</span>
        </span>
        <span style="font-size:14px;font-weight:800;margin-top:11px;line-height:1.45;">承認する</span>
        <span style="font-size:10.5px;color:#92400E;font-weight:600;margin-top:auto;">Instagram 3本</span>
      </button>

      <button class="liquid" style="border-radius:15px;padding:16px 14px;text-align:left;font-family:inherit;color:inherit;display:flex;flex-direction:column;min-height:132px;box-sizing:border-box;">
        <span style="width:38px;height:38px;border-radius:11px;background:rgba(16,21,33,0.07);display:flex;align-items:center;justify-content:center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#101521" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="8" width="16" height="12" rx="2.5"/><path d="M12 8V4M9 14h.01M15 14h.01"/></svg></span>
        <span style="font-size:14px;font-weight:800;margin-top:11px;line-height:1.45;">エージェントを<br>動かす</span>
        <span style="font-size:10.5px;color:#6A7280;font-weight:600;margin-top:auto;">5件を保存済み</span>
      </button>
    </div>

    <div style="font-size:11px;color:#6A7280;margin-top:18px;line-height:1.7;text-align:center;">細かい設定と監査はパソコンで。<br>ここには「いま決めること」だけを置いています。</div>
  </div>

  <nav class="navbar" style="flex-shrink:0;height:56px;display:flex;position:relative;z-index:1;">
    <button type="button" class="tab tab-on" aria-current="page">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10l9-7 9 7v10a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><path d="M9 22V12h6v10"/></svg>
      <span style="font-size:10px;font-weight:700;">ホーム</span>
    </button>
    <button type="button" class="tab">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 01-9 8.4 8.9 8.9 0 01-4-.9L3 21l1.9-4.9A8.4 8.4 0 013.6 11 8.4 8.4 0 0112 3a8.4 8.4 0 019 8.5z"/></svg>
      <span style="font-size:10px;font-weight:600;">チャット</span>
    </button>
    <button type="button" class="tab">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V8z"/><path d="M14 3v5h5"/></svg>
      <span style="font-size:10px;font-weight:600;">成果物</span>
    </button>
    <button type="button" class="tab">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      <span style="font-size:10px;font-weight:600;">メニュー</span>
    </button>
  </nav>
</div>
</x-dc>
</body>
</html>
