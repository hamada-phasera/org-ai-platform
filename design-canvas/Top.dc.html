<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; font-family: 'Manrope','Noto Sans JP',system-ui,sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #3D4EFF; text-decoration: none; }
    a:hover { color: #2A38D6; }
    .mono { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; }
    .nav { display: flex; align-items: center; gap: 9px; width: 100%; height: 32px; padding: 0 10px; border: none; background: transparent; border-radius: 7px; font-family: inherit; font-size: 12.5px; font-weight: 600; color: #59616F; text-align: left; cursor: pointer; }
    .nav:hover { background: #F5F6F8; color: #101521; }
    .nav:focus-visible { outline: 2px solid #3D4EFF; outline-offset: 2px; }
    .nav-on, .nav-on:hover { background: #101521; color: #FFFFFF; }
    .grp { font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #6A7280; padding: 0 10px; margin: 16px 0 6px; }
    .sr { width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; flex-shrink: 0; }
    /* 液体ガラス — 適用してよいのは TOP の入口・タブ・ボトムナビだけ。カードや表には使わない。 */
    .liquid {
      background: rgba(255,255,255,0.72);
      backdrop-filter: blur(14px) saturate(1.5);
      -webkit-backdrop-filter: blur(14px) saturate(1.5);
      border: 1px solid rgba(255,255,255,0.9);
      box-shadow: 0 1px 2px rgba(16,21,33,0.04), 0 10px 30px rgba(16,21,33,0.05);
    }
    /* backdrop-filter 非対応環境では不透明に落とす（透けないと文字が背景に溶ける） */
    @supports not (backdrop-filter: blur(1px)) {
      .liquid { background: #FFFFFF; border-color: #E7E9ED; }
    }
  </style>
</helmet>

<div style="width:1440px;height:900px;background:#FBFBFC;color:#101521;display:flex;overflow:hidden;box-sizing:border-box;">

  <aside style="width:240px;flex-shrink:0;background:#FFFFFF;border-right:1px solid #E7E9ED;display:flex;flex-direction:column;padding:14px 12px 12px;box-sizing:border-box;">
    <div style="display:flex;align-items:center;gap:9px;padding:0 8px 14px;">
      <div style="width:26px;height:26px;border-radius:7px;background:#101521;display:flex;align-items:center;justify-content:center;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h11M4 18h7"/></svg></div>
      <div style="font-size:15px;font-weight:800;letter-spacing:-0.01em;">FLOW</div>
    </div>

    <button type="button" aria-label="組織を切り替え — 株式会社フェイズラ、STARTER プラン" style="display:flex;align-items:center;gap:9px;width:100%;padding:8px 9px;border:1px solid #E7E9ED;border-radius:8px;background:#FBFBFC;font-family:inherit;text-align:left;cursor:pointer;box-sizing:border-box;">
      <span style="width:22px;height:22px;border-radius:5px;background:#101521;color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;">株</span>
      <span style="flex:1;min-width:0;">
        <span style="display:block;font-size:11.5px;font-weight:700;color:#101521;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">株式会社フェイズラ</span>
        <span style="display:block;font-size:9.5px;color:#6A7280;font-weight:600;">STARTER プラン</span>
      </span>
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#6A7280" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M8 9l4-4 4 4M16 15l-4 4-4-4"/></svg>
    </button>

    <nav style="display:flex;flex-direction:column;gap:2px;margin-top:14px;">
      <button type="button" class="nav nav-on" aria-current="page"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10l9-7 9 7v10a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><path d="M9 22V12h6v10"/></svg>ホーム</button>
      <button type="button" class="nav"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V10M10 19V5M16 19v-6M21 19H3"/></svg>ダッシュボード</button>
      <button type="button" class="nav"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 01-9 8.4 8.9 8.9 0 01-4-.9L3 21l1.9-4.9A8.4 8.4 0 013.6 11 8.4 8.4 0 0112 3a8.4 8.4 0 019 8.5z"/></svg>チャット<span style="margin-left:auto;display:inline-flex;align-items:center;height:17px;padding:0 6px;border-radius:5px;background:#F5F6F8;color:#6A7280;font-size:9.5px;font-weight:800;" class="mono">3</span></button>
      <button type="button" class="nav"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="8" width="16" height="12" rx="2.5"/><path d="M12 8V4M9 14h.01M15 14h.01"/></svg>エージェント</button>
      <button type="button" class="nav"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V8z"/><path d="M14 3v5h5"/></svg>成果物<span class="sr">新着あり</span><span style="margin-left:auto;width:6px;height:6px;border-radius:50%;background:#3D4EFF;"></span></button>
      <button type="button" class="nav"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg>タスク</button>

      <div class="grp">業務ページ</div>
      <button type="button" class="nav"><span style="width:8px;height:8px;border-radius:2px;background:#4F46E5;margin-left:3px;margin-right:4px;"></span>営業パイプライン</button>
      <button type="button" class="nav"><span style="width:8px;height:8px;border-radius:2px;background:#0D9488;margin-left:3px;margin-right:4px;"></span>データ分析</button>
      <button type="button" class="nav"><span style="width:8px;height:8px;border-radius:2px;background:#9333EA;margin-left:3px;margin-right:4px;"></span>SNS投稿</button>

      <div class="grp">管理</div>
      <button type="button" class="nav"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7.5 3v6c0 4.6-3.1 8.2-7.5 9.4C7.6 20.2 4.5 16.6 4.5 12V6z"/></svg>ガバナンス<span style="margin-left:auto;display:inline-flex;align-items:center;height:17px;padding:0 6px;border-radius:5px;background:#FEF2F2;border:1px solid #FECACA;color:#B91C1C;font-size:9.5px;font-weight:800;">1</span></button>
      <button type="button" class="nav"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.6 1.6 0 00-2.7 1.1V21a2 2 0 11-4 0v-.1A1.6 1.6 0 006.9 19.4l-.1.1a2 2 0 11-2.8-2.8l.1-.1A1.6 1.6 0 003 14.6a2 2 0 010-4h.1A1.6 1.6 0 004.6 6.9l-.1-.1a2 2 0 112.8-2.8l.1.1a1.6 1.6 0 002.7-1.1V3a2 2 0 114 0v.1a1.6 1.6 0 002.7 1.1l.1-.1a2 2 0 112.8 2.8l-.1.1a1.6 1.6 0 001.1 2.7H21a2 2 0 010 4h-.1a1.6 1.6 0 00-1.5 1.3z"/></svg>設定</button>
    </nav>

    <div style="margin-top:auto;">
      <div style="border:1px solid #E7E9ED;border-radius:9px;padding:10px 11px;background:#FBFBFC;">
        <div style="display:flex;align-items:center;justify-content:space-between;font-size:10.5px;font-weight:700;color:#59616F;">今月の AI 呼び出し<span class="mono" style="color:#101521;">62 / 100</span></div>
        <div style="height:4px;border-radius:2px;background:#E7E9ED;margin-top:7px;overflow:hidden;"><div style="width:62%;height:100%;background:#101521;"></div></div>
        <div style="font-size:9.5px;color:#6A7280;margin-top:6px;">9月1日にリセット</div>
      </div>
      <button type="button" aria-label="アカウント — 濱田 大和、OWNER" style="display:flex;align-items:center;gap:9px;width:100%;margin-top:10px;padding:6px 8px;border:none;background:transparent;border-radius:8px;font-family:inherit;text-align:left;cursor:pointer;box-sizing:border-box;">
        <span style="width:26px;height:26px;border-radius:50%;background:#F5F6F8;border:1px solid #E7E9ED;font-size:10.5px;font-weight:800;display:flex;align-items:center;justify-content:center;color:#59616F;flex-shrink:0;">濱</span>
        <span style="flex:1;min-width:0;"><span style="display:block;font-size:11.5px;font-weight:700;color:#101521;">濱田 大和</span><span style="display:block;font-size:9.5px;color:#6A7280;">OWNER</span></span>
      </button>
    </div>
  </aside>

  <div style="flex:1;min-width:0;display:flex;flex-direction:column;position:relative;">

    <!-- 背景のにじみ。ガラスが「何かの上に乗っている」ことを成立させるために置く。 -->
    <div style="position:absolute;inset:0;overflow:hidden;pointer-events:none;">
      <div style="position:absolute;top:-120px;left:120px;width:620px;height:520px;border-radius:50%;background:radial-gradient(circle at 50% 50%, rgba(61,78,255,0.10), rgba(61,78,255,0) 68%);"></div>
      <div style="position:absolute;top:180px;right:-80px;width:560px;height:520px;border-radius:50%;background:radial-gradient(circle at 50% 50%, rgba(13,148,136,0.09), rgba(13,148,136,0) 68%);"></div>
      <div style="position:absolute;bottom:-160px;left:38%;width:520px;height:420px;border-radius:50%;background:radial-gradient(circle at 50% 50%, rgba(147,51,234,0.07), rgba(147,51,234,0) 68%);"></div>
    </div>

    <header style="height:52px;flex-shrink:0;display:flex;align-items:center;gap:14px;padding:0 24px;box-sizing:border-box;position:relative;z-index:1;">
      <div style="margin-left:auto;display:flex;align-items:center;gap:8px;">
        <span style="display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 9px;border-radius:6px;background:rgba(236,253,245,0.8);border:1px solid #A7F3D0;font-size:10.5px;font-weight:700;color:#047857;"><span style="width:5px;height:5px;border-radius:50%;background:#059669;"></span>すべて正常</span>
        <button aria-label="表示テーマを切り替え" style="width:30px;height:30px;border-radius:7px;border:1px solid #E7E9ED;background:rgba(255,255,255,0.7);display:flex;align-items:center;justify-content:center;cursor:pointer;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#59616F" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M19 5l-1.5 1.5M6.5 17.5L5 19"/></svg>
        </button>
      </div>
    </header>

    <div style="flex:1;display:flex;flex-direction:column;align-items:center;padding:52px 24px 0;box-sizing:border-box;position:relative;z-index:1;">
      <div style="width:100%;max-width:760px;">

        <!-- 挨拶。数字は出さない。 -->
        <div style="text-align:center;">
          <div style="font-size:34px;font-weight:800;letter-spacing:-0.03em;line-height:1.35;">おはようございます、濱田さん。</div>
          <div style="font-size:14px;color:#59616F;margin-top:10px;">今日やることを一行で伝えてください。担当の部署AIに振り分けます。</div>
        </div>

        <!-- 指示入力 -->
        <div class="liquid" style="display:flex;align-items:center;gap:12px;height:60px;border-radius:14px;padding:0 8px 0 18px;margin-top:30px;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6A7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M21 11.5a8.4 8.4 0 01-9 8.4 8.9 8.9 0 01-4-.9L3 21l1.9-4.9A8.4 8.4 0 013.6 11 8.4 8.4 0 0112 3a8.4 8.4 0 019 8.5z"/></svg>
          <label for="top-input" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;">今日は何をしますか？</label>
          <input id="top-input" readonly value="" placeholder="今日は何をしますか？" style="flex:1;border:none;outline:none;background:transparent;font-family:inherit;font-size:15px;color:#101521;min-width:0;">
          <button aria-label="ファイルを添付" style="width:40px;height:40px;border-radius:10px;border:1px solid #E7E9ED;background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#59616F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.5l-8.4 8.4a5 5 0 01-7.1-7.1l8.5-8.5a3.4 3.4 0 014.8 4.8l-8.5 8.5a1.7 1.7 0 01-2.4-2.4l7.8-7.8"/></svg>
          </button>
          <button style="height:44px;padding:0 18px;border-radius:11px;border:none;background:#101521;color:#fff;font-size:13.5px;font-weight:700;font-family:inherit;display:flex;align-items:center;gap:7px;cursor:pointer;flex-shrink:0;">
            送信<span class="mono" style="font-size:10px;opacity:0.55;">⏎</span>
          </button>
        </div>

        <!-- 入口4つ。ここが「押したら詳しく見られる」の起点。 -->
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:34px;">

          <button class="liquid" style="border-radius:16px;padding:22px 22px 20px;text-align:left;cursor:pointer;font-family:inherit;color:inherit;display:flex;flex-direction:column;gap:0;min-height:150px;box-sizing:border-box;">
            <span style="display:flex;align-items:center;gap:12px;">
              <span style="width:40px;height:40px;border-radius:11px;background:rgba(79,70,229,0.10);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
                <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#4F46E5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V8z"/><path d="M14 3v5h5"/></svg>
              </span>
              <span style="font-size:17px;font-weight:800;letter-spacing:-0.01em;">提案書をつくる</span>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A9B0BB" stroke-width="2.2" stroke-linecap="round" style="margin-left:auto;flex-shrink:0;"><path d="M9 6l6 6-6 6"/></svg>
            </span>
            <span style="display:block;font-size:12.5px;color:#59616F;line-height:1.75;margin-top:12px;">商談の履歴と手元の資料から、営業部AIが下書きを起こします。</span>
            <span style="display:flex;align-items:center;gap:7px;margin-top:auto;padding-top:14px;">
              <img src="char-sales.png" alt="" style="width:22px;height:22px;object-fit:contain;display:block;">
              <span style="font-size:11px;font-weight:700;color:#6A7280;">セールスくん が担当</span>
            </span>
          </button>

          <button class="liquid" style="border-radius:16px;padding:22px 22px 20px;text-align:left;cursor:pointer;font-family:inherit;color:inherit;display:flex;flex-direction:column;min-height:150px;box-sizing:border-box;">
            <span style="display:flex;align-items:center;gap:12px;">
              <span style="width:40px;height:40px;border-radius:11px;background:rgba(13,148,136,0.10);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
                <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#0D9488" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V10M10 19V5M16 19v-6M21 19H3"/></svg>
              </span>
              <span style="font-size:17px;font-weight:800;letter-spacing:-0.01em;">数字を見る</span>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A9B0BB" stroke-width="2.2" stroke-linecap="round" style="margin-left:auto;flex-shrink:0;"><path d="M9 6l6 6-6 6"/></svg>
            </span>
            <span style="display:block;font-size:12.5px;color:#59616F;line-height:1.75;margin-top:12px;">削減できた時間と、部署ごとの内訳。押すとこの場で開きます。</span>
            <span style="display:flex;align-items:center;gap:7px;margin-top:auto;padding-top:14px;">
              <img src="char-analytics.png" alt="" style="width:22px;height:22px;object-fit:contain;display:block;">
              <span style="font-size:11px;font-weight:700;color:#6A7280;">アナリーゼ が担当</span>
            </span>
          </button>

          <button class="liquid" style="border-radius:16px;padding:22px 22px 20px;text-align:left;cursor:pointer;font-family:inherit;color:inherit;display:flex;flex-direction:column;min-height:150px;box-sizing:border-box;border-color:rgba(253,230,138,0.9);">
            <span style="display:flex;align-items:center;gap:12px;">
              <span style="width:40px;height:40px;border-radius:11px;background:rgba(217,119,6,0.12);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
                <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#B45309" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 12l2 2 4-4"/><circle cx="12" cy="12" r="9"/></svg>
              </span>
              <span style="font-size:17px;font-weight:800;letter-spacing:-0.01em;">承認する</span>
              <span style="margin-left:auto;display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px;border-radius:6px;background:#FFFBEB;border:1px solid #FDE68A;font-size:11px;font-weight:800;color:#B45309;flex-shrink:0;"><span style="width:5px;height:5px;border-radius:50%;background:#D97706;"></span>1件</span>
            </span>
            <span style="display:block;font-size:12.5px;color:#59616F;line-height:1.75;margin-top:12px;">あなたの確認を待っているもの。承認するまで外部には出ません。</span>
            <span style="display:flex;align-items:center;gap:7px;margin-top:auto;padding-top:14px;">
              <img src="char-marketing.png" alt="" style="width:22px;height:22px;object-fit:contain;display:block;">
              <span style="font-size:11px;font-weight:700;color:#92400E;">Instagram 投稿 3本の下書き</span>
            </span>
          </button>

          <button class="liquid" style="border-radius:16px;padding:22px 22px 20px;text-align:left;cursor:pointer;font-family:inherit;color:inherit;display:flex;flex-direction:column;min-height:150px;box-sizing:border-box;">
            <span style="display:flex;align-items:center;gap:12px;">
              <span style="width:40px;height:40px;border-radius:11px;background:rgba(16,21,33,0.07);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
                <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#101521" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="8" width="16" height="12" rx="2.5"/><path d="M12 8V4M9 14h.01M15 14h.01"/></svg>
              </span>
              <span style="font-size:17px;font-weight:800;letter-spacing:-0.01em;">エージェントを動かす</span>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A9B0BB" stroke-width="2.2" stroke-linecap="round" style="margin-left:auto;flex-shrink:0;"><path d="M9 6l6 6-6 6"/></svg>
            </span>
            <span style="display:block;font-size:12.5px;color:#59616F;line-height:1.75;margin-top:12px;">保存済みの手順を、ひと押しで実行します。</span>
            <span style="display:flex;align-items:center;gap:7px;margin-top:auto;padding-top:14px;">
              <img src="char-general.png" alt="" style="width:22px;height:22px;object-fit:contain;display:block;">
              <img src="char-accounting.png" alt="" style="width:22px;height:22px;object-fit:contain;display:block;margin-left:-8px;">
              <img src="char-sales.png" alt="" style="width:22px;height:22px;object-fit:contain;display:block;margin-left:-8px;">
              <span style="font-size:11px;font-weight:700;color:#6A7280;margin-left:4px;">5件を保存済み</span>
            </span>
          </button>
        </div>

        <div style="text-align:center;font-size:11.5px;color:#6A7280;margin-top:28px;line-height:1.7;">
          もっと細かく見るときは、左のメニューから。<span style="color:#6A7280;">ここには「いま決めること」だけを置いています。</span>
        </div>

      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
