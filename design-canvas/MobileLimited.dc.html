<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; font-family: 'Manrope','Noto Sans JP',system-ui,sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #3D4EFF; text-decoration: none; }
    a:hover { color: #2A38D6; }
    .mono { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; }
    .mi { display: flex; align-items: center; gap: 12px; height: 52px; padding: 0 14px; border-bottom: 1px solid #F0F1F4; }
    .tab { flex: 1; border: none; background: transparent; font-family: inherit; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; height: 56px; color: #6A7280; }
    .tab-on { color: #101521; }
    .navbar { background: rgba(255,255,255,0.78); backdrop-filter: blur(16px) saturate(1.6); -webkit-backdrop-filter: blur(16px) saturate(1.6); border-top: 1px solid rgba(231,233,237,0.9); }
    @supports not (backdrop-filter: blur(1px)) { .navbar { background: #FFFFFF; border-top-color: #E7E9ED; } }
  </style>
</helmet>

<div style="width:390px;height:844px;background:#FBFBFC;color:#101521;display:flex;flex-direction:column;overflow:hidden;box-sizing:border-box;">

  <header style="height:52px;flex-shrink:0;background:#fff;border-bottom:1px solid #E7E9ED;display:flex;align-items:center;gap:10px;padding:0 14px;box-sizing:border-box;">
    <div style="font-size:14px;font-weight:800;">メニュー</div>
    <div style="margin-left:auto;display:flex;align-items:center;gap:8px;">
      <div style="width:22px;height:22px;border-radius:5px;background:#101521;color:#fff;font-size:9.5px;font-weight:800;display:flex;align-items:center;justify-content:center;">株</div>
      <div><div style="font-size:11px;font-weight:700;">株式会社フェイズラ</div><div style="font-size:9.5px;color:#6A7280;font-weight:600;">STARTER</div></div>
    </div>
  </header>

  <div style="flex:1;overflow:hidden;">

    <div style="background:#fff;border-bottom:1px solid #E7E9ED;">
      <div style="font-size:10px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:#6A7280;padding:14px 14px 7px;">スマホで使える</div>
      <div class="mi">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#101521" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10l9-7 9 7v10a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><path d="M9 22V12h6v10"/></svg>
        <span style="font-size:13.5px;font-weight:600;flex:1;">ホーム</span>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#6A7280" stroke-width="2.3" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>
      </div>
      <div class="mi">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#101521" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 01-9 8.4 8.9 8.9 0 01-4-.9L3 21l1.9-4.9A8.4 8.4 0 013.6 11 8.4 8.4 0 0112 3a8.4 8.4 0 019 8.5z"/></svg>
        <span style="font-size:13.5px;font-weight:600;flex:1;">チャット</span>
        <span class="mono" style="font-size:10.5px;color:#6A7280;background:#F5F6F8;border-radius:5px;padding:2px 7px;">3</span>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#6A7280" stroke-width="2.3" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>
      </div>
      <div class="mi">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#101521" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V8z"/><path d="M14 3v5h5"/></svg>
        <span style="font-size:13.5px;font-weight:600;flex:1;">成果物（閲覧・共有）</span>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#6A7280" stroke-width="2.3" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>
      </div>
      <div class="mi" style="border-bottom:none;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#101521" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 12l2 2 4-4"/><circle cx="12" cy="12" r="9"/></svg>
        <span style="font-size:13.5px;font-weight:600;flex:1;">承認する</span>
        <span style="display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:5px;background:#FFFBEB;border:1px solid #FDE68A;color:#B45309;font-size:10px;font-weight:800;">1</span>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#6A7280" stroke-width="2.3" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>
      </div>
    </div>

    <div style="background:#fff;border-bottom:1px solid #E7E9ED;margin-top:10px;">
      <div style="display:flex;align-items:center;gap:7px;padding:14px 14px 7px;">
        <span style="font-size:10px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:#6A7280;">パソコン向け</span>
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#6A7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>
      </div>
      <div class="mi">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A9B0BB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="8" width="16" height="12" rx="2.5"/><path d="M12 8V4M9 14h.01M15 14h.01"/></svg>
        <span style="font-size:13.5px;font-weight:600;flex:1;color:#6A7280;">エージェントの作成・編集</span>
      </div>
      <div class="mi">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A9B0BB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7.5 3v6c0 4.6-3.1 8.2-7.5 9.4C7.6 20.2 4.5 16.6 4.5 12V6z"/></svg>
        <span style="font-size:13.5px;font-weight:600;flex:1;color:#6A7280;">ガバナンス（AIログ・リスク）</span>
      </div>
      <div class="mi">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A9B0BB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/></svg>
        <span style="font-size:13.5px;font-weight:600;flex:1;color:#6A7280;">業務ページ（営業パイプライン・データ分析・SNS投稿）</span>
      </div>
      <div class="mi" style="border-bottom:none;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A9B0BB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg>
        <span style="font-size:13.5px;font-weight:600;flex:1;color:#6A7280;">タスクの一括操作</span>
      </div>
    </div>

    <div style="margin:6px 12px;border:1px solid #E7E9ED;border-radius:12px;background:#fff;padding:10px 14px;">
      <div style="display:flex;align-items:center;gap:9px;">
        <div style="width:32px;height:32px;border-radius:8px;background:#F5F6F8;border:1px solid #E7E9ED;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#59616F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>
        </div>
        <div style="font-size:13px;font-weight:800;">これらはパソコンでご利用ください</div>
      </div>
      <div style="font-size:12px;color:#59616F;line-height:1.7;margin-top:8px;">
        エージェントの手順編集やAIログの監査は、表が横に長く、スマホでは正確に扱えません。<b style="color:#101521;">閲覧・承認・チャットはスマホ</b>、<b style="color:#101521;">設定と監査はパソコン</b>という分担にしています。
      </div>
    </div>

    <div style="margin:0 12px;display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;background:#fff;border:1px solid #E7E9ED;">
      <div style="width:32px;height:32px;border-radius:50%;background:#F5F6F8;border:1px solid #E7E9ED;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;color:#59616F;">濱</div>
      <div style="flex:1;"><div style="font-size:12.5px;font-weight:700;">濱田 大和</div><div style="font-size:10.5px;color:#6A7280;">OWNER · 今月 62 / 100 回</div></div>
      <button type="button" style="display:inline-flex;align-items:center;height:44px;padding:0 14px;border-radius:9px;border:1px solid #E7E9ED;background:#fff;color:#101521;font-size:12px;font-weight:700;font-family:inherit;">設定</button>
    </div>
  </div>

  <nav class="navbar" style="flex-shrink:0;height:56px;display:flex;">
    <button type="button" class="tab"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10l9-7 9 7v10a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><path d="M9 22V12h6v10"/></svg><span style="font-size:10px;font-weight:600;">ホーム</span></button>
    <button type="button" class="tab"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 01-9 8.4 8.9 8.9 0 01-4-.9L3 21l1.9-4.9A8.4 8.4 0 013.6 11 8.4 8.4 0 0112 3a8.4 8.4 0 019 8.5z"/></svg><span style="font-size:10px;font-weight:600;">チャット</span></button>
    <button type="button" class="tab"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V8z"/><path d="M14 3v5h5"/></svg><span style="font-size:10px;font-weight:600;">成果物</span></button>
    <button type="button" class="tab tab-on" aria-current="page"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg><span style="font-size:10px;font-weight:700;">メニュー</span></button>
  </nav>
</div>
</x-dc>
</body>
</html>
