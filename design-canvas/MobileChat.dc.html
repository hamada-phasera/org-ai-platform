<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; font-family: 'Manrope','Noto Sans JP',system-ui,sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #3D4EFF; text-decoration: none; }
    a:hover { color: #2A38D6; }
    .mono { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  </style>
</helmet>

<div style="width:390px;height:844px;background:#FFFFFF;color:#101521;display:flex;flex-direction:column;overflow:hidden;box-sizing:border-box;">

  <header style="height:56px;flex-shrink:0;border-bottom:1px solid #E7E9ED;display:flex;align-items:center;gap:10px;padding:0 12px;box-sizing:border-box;">
    <button aria-label="戻る" style="width:44px;height:44px;border-radius:11px;border:none;background:transparent;display:flex;align-items:center;justify-content:center;"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#101521" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
    <img src="char-sales.png" alt="セールスくん" style="width:28px;height:28px;object-fit:contain;">
    <div style="flex:1;min-width:0;"><div style="font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">ミナト向け提案書</div><div style="font-size:10.5px;color:#6A7280;font-weight:600;">セールスくん · 営業部</div></div>
    <button aria-label="この会話の操作" style="width:44px;height:44px;border-radius:11px;border:1px solid #E7E9ED;background:#fff;display:flex;align-items:center;justify-content:center;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#59616F" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="5" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="12" cy="19" r="1.4"/></svg></button>
  </header>

  <!-- dept strip -->
  <div style="flex-shrink:0;display:flex;gap:6px;padding:10px 12px;border-bottom:1px solid #F0F1F4;overflow:hidden;">
    <span style="display:inline-flex;align-items:center;gap:5px;height:40px;padding:0 11px;border-radius:8px;background:#101521;color:#fff;font-size:12px;font-weight:700;flex-shrink:0;"><img src="char-sales.png" alt="" style="width:17px;height:17px;object-fit:contain;">営業部</span>
    <span style="display:inline-flex;align-items:center;gap:5px;height:40px;padding:0 11px;border-radius:8px;border:1px solid #E7E9ED;color:#59616F;font-size:12px;font-weight:600;flex-shrink:0;"><img src="char-marketing.png" alt="" style="width:17px;height:17px;object-fit:contain;">マーケ部</span>
    <span style="display:inline-flex;align-items:center;gap:5px;height:40px;padding:0 11px;border-radius:8px;border:1px solid #E7E9ED;color:#59616F;font-size:12px;font-weight:600;flex-shrink:0;"><img src="char-accounting.png" alt="" style="width:17px;height:17px;object-fit:contain;">経理部</span>
    <span style="display:inline-flex;align-items:center;gap:5px;height:40px;padding:0 11px;border-radius:8px;border:1px solid #E7E9ED;color:#59616F;font-size:12px;font-weight:600;flex-shrink:0;"><img src="char-analytics.png" alt="" style="width:17px;height:17px;object-fit:contain;">データ分析</span>
  </div>

  <div style="flex:1;min-height:0;overflow:hidden;padding:16px 14px 0;box-sizing:border-box;">

    <div style="display:flex;gap:9px;">
      <div style="width:24px;height:24px;border-radius:50%;background:#F5F6F8;border:1px solid #E7E9ED;font-size:9.5px;font-weight:800;display:flex;align-items:center;justify-content:center;color:#59616F;flex-shrink:0;">濱</div>
      <div style="flex:1;">
        <div style="font-size:10.5px;font-weight:800;color:#59616F;margin-bottom:4px;">濱田 大和</div>
        <div style="font-size:13px;line-height:1.8;">株式会社ミナト向けの提案書をつくりたい。先方は物流で、繁忙期の配車調整に困っている。</div>
      </div>
    </div>

    <div style="display:flex;gap:9px;margin-top:18px;">
      <img src="char-sales.png" alt="セールスくん" style="width:24px;height:24px;object-fit:contain;flex-shrink:0;">
      <div style="flex:1;">
        <div style="font-size:10.5px;font-weight:800;color:#59616F;margin-bottom:6px;">セールスくん</div>
        <div style="border:1px solid #DDE1FF;background:#EEF0FF;border-radius:10px;padding:11px 12px;">
          <div style="display:flex;align-items:center;gap:6px;margin-bottom:6px;">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#2A38D6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg>
            <span style="font-size:10.5px;font-weight:800;color:#2A38D6;">これから行うこと</span>
          </div>
          <div style="font-size:12px;line-height:1.75;">ヒアリングメモと<b>商談履歴3件</b>を参照して提案書ドラフトを作ります。<b>金額は書きません</b>。</div>
          <div style="display:flex;gap:7px;margin-top:11px;">
            <button style="flex:1;height:44px;border-radius:8px;border:none;background:#101521;color:#fff;font-size:12.5px;font-weight:700;font-family:inherit;">実行する</button>
            <button style="flex:1;height:44px;border-radius:8px;border:1px solid #D8DCE3;background:#fff;color:#101521;font-size:12.5px;font-weight:600;font-family:inherit;">変更</button>
          </div>
        </div>
      </div>
    </div>

    <div style="display:flex;gap:9px;margin-top:18px;">
      <img src="char-sales.png" alt="セールスくん" style="width:24px;height:24px;object-fit:contain;flex-shrink:0;">
      <div style="flex:1;">
        <div style="font-size:13px;line-height:1.85;">提案書のドラフトができました。先方の課題は「繁忙期に配車担当1名へ問い合わせが集中し、1日 <b>約2.5時間</b> が電話対応に消えている」点<span class="mono" style="display:inline-flex;align-items:center;height:15px;padding:0 4px;border-radius:4px;background:#F0F1F4;border:1px solid #D8DCE3;font-size:9px;font-weight:700;color:#59616F;margin:0 2px;">f1</span>です。</div>
        <div style="display:flex;align-items:center;gap:8px;border:1px solid #E7E9ED;border-radius:9px;padding:9px 11px;margin-top:10px;">
          <div style="width:26px;height:26px;border-radius:6px;background:#F5F6F8;border:1px solid #E7E9ED;display:flex;align-items:center;justify-content:center;flex-shrink:0;"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#59616F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V8z"/><path d="M14 3v5h5"/></svg></div>
          <div style="flex:1;min-width:0;"><div style="font-size:11.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">ミナト様 ご提案.docx</div><div style="font-size:10px;color:#6A7280;">10:44 · Google ドキュメント</div></div>
          <span style="display:inline-flex;align-items:center;height:19px;padding:0 6px;border-radius:5px;background:#101521;color:#fff;font-size:9.5px;font-weight:800;">高</span>
        </div>
      </div>
    </div>
  </div>

  <div style="flex-shrink:0;padding:10px 14px 16px;box-sizing:border-box;border-top:1px solid #F0F1F4;">
    <div style="display:flex;gap:6px;margin-bottom:9px;overflow:hidden;">
      <span style="display:inline-flex;align-items:center;gap:5px;height:36px;padding:0 11px;border-radius:8px;border:1px solid #E7E9ED;background:#fff;font-size:11.5px;font-weight:600;flex-shrink:0;"><span style="width:6px;height:6px;border-radius:50%;background:#16A34A;"></span>ドキュメント</span>
      <span style="display:inline-flex;align-items:center;gap:5px;height:36px;padding:0 11px;border-radius:8px;border:1px solid #E7E9ED;background:#fff;font-size:11.5px;font-weight:600;flex-shrink:0;"><span style="width:6px;height:6px;border-radius:50%;background:#16A34A;"></span>スプレッドシート</span>
      <span style="display:inline-flex;align-items:center;gap:5px;height:36px;padding:0 11px;border-radius:8px;border:1px solid #FED7AA;background:#FFF7ED;color:#C2410C;font-size:11.5px;font-weight:600;flex-shrink:0;">Slack</span>
    </div>
    <div style="display:flex;align-items:center;gap:8px;">
      <button aria-label="ファイルを添付" style="width:44px;height:44px;border-radius:11px;border:1px solid #E7E9ED;background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#59616F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.5l-8.4 8.4a5 5 0 01-7.1-7.1l8.5-8.5a3.4 3.4 0 014.8 4.8l-8.5 8.5a1.7 1.7 0 01-2.4-2.4l7.8-7.8"/></svg></button>
      <div style="flex:1;height:44px;border:1px solid #D8DCE3;border-radius:11px;display:flex;align-items:center;padding:0 13px;font-size:13px;color:#6A7280;">指示する…</div>
      <button aria-label="送信" style="width:44px;height:44px;border-radius:11px;border:none;background:#101521;display:flex;align-items:center;justify-content:center;flex-shrink:0;"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
